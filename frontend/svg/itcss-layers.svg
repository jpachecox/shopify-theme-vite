<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="496" viewBox="0 0 1200 496" role="img" aria-labelledby="itcssTitle itcssDesc">
  <title id="itcssTitle">Cascade layers, in declaration order</title>
  <desc id="itcssDesc">The eight CSS cascade layers used by the theme styles, from lowest to highest precedence: settings, generic, elements, objects, components, sections, snippets and utilities. Declared in frontend/styles/generic/_layer-order.scss and loaded first by frontend/entrypoints/base.scss.</desc>

  <defs>
    <filter id="itcssGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <clipPath id="itcssBoard">
      <rect width="1200" height="496" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#itcssBoard)">
    <rect width="1200" height="496" fill="#12151C"/>
    <ellipse cx="1130" cy="-40" rx="300" ry="190" fill="#646CFF" opacity="0.3" filter="url(#itcssGlow)"/>
    <ellipse cx="70" cy="540" rx="240" ry="150" fill="#646CFF" opacity="0.13" filter="url(#itcssGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="495" rx="15.5" fill="none" stroke="#262C38"/>
  </g>

  <g id="header" transform="translate(64 44)">
    <rect x="0" y="0" width="48" height="5" rx="2.5" fill="#646CFF"/>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Cascade layers, in declaration order</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8A93A6">frontend/styles/generic/_layer-order.scss, loaded first by entrypoints/base.scss</text>
  </g>

  <g id="layers">
    <g transform="translate(64 150)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.35"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">settings</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">tokens and custom properties</text>
    </g>
    <g transform="translate(64 188)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.45"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">generic</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">reset and document defaults</text>
    </g>
    <g transform="translate(64 226)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.55"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">elements</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">bare HTML element styles</text>
    </g>
    <g transform="translate(64 264)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.65"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">objects</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">layout primitives (o- prefix)</text>
    </g>
    <g transform="translate(64 302)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.75"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">components</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">reusable component styles</text>
    </g>
    <g transform="translate(64 340)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.85"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">sections</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">Shopify section styles</text>
    </g>
    <g transform="translate(64 378)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="0.92"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">snippets</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">Shopify snippet styles</text>
    </g>
    <g transform="translate(64 416)">
      <rect x="0" y="0" width="860" height="32" rx="6" fill="#171B22" stroke="#262C38"/>
      <rect x="0" y="0" width="6" height="32" rx="3" fill="#646CFF" opacity="1"/>
      <text x="24" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">utilities</text>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">single-purpose (u-) overrides</text>
    </g>
  </g>

  <g id="precedence" transform="translate(968 150)">
    <path d="M 20 0 L 20 282" stroke="#8A93A6" stroke-width="2" fill="none"/>
    <path d="M 20 298 L 13 284 L 27 284 Z" fill="#8A93A6"/>
    <text x="52" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">later</text>
    <text x="52" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">layers</text>
    <text x="52" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A93A6">win</text>
  </g>
</svg>
