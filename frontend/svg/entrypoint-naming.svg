<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-labelledby="entryTitle entryDesc">
  <title id="entryTitle">From Sass partial to Liquid</title>
  <desc id="entryDesc">Four steps: create a partial such as component/_button-group.scss, let auto-entrypoints generate entrypoints/component-button-group.scss, then render it from Liquid with the vite-tag snippet. Partial names use lowercase letters and hyphens only.</desc>

  <defs>
    <filter id="entryGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <clipPath id="entryBoard">
      <rect width="1200" height="368" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#entryBoard)">
    <rect width="1200" height="368" fill="#12151C"/>
    <ellipse cx="1130" cy="-40" rx="300" ry="190" fill="#646CFF" opacity="0.3" filter="url(#entryGlow)"/>
    <ellipse cx="70" cy="410" rx="240" ry="150" fill="#646CFF" opacity="0.13" filter="url(#entryGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="367" rx="15.5" fill="none" stroke="#262C38"/>
  </g>

  <g id="header" transform="translate(48 40)">
    <rect x="0" y="0" width="48" height="5" rx="2.5" fill="#646CFF"/>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">From Sass partial to Liquid</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8A93A6">one partial → one generated entrypoint → one render tag</text>
  </g>

  <g id="step-1" transform="translate(48 150)">
    <rect x="0" y="0" width="246" height="140" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A6">1 · CREATE</text>
    <text x="16" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">component/</text>
    <text x="16" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">_button-group.scss</text>
  </g>

  <g id="chevron-1">
    <path d="M 306 220 L 326 220" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path d="M 326 220 L 314 213 L 314 227 Z" fill="#7C8CFF"/>
  </g>

  <g id="step-2" transform="translate(342 150)">
    <rect x="0" y="0" width="246" height="140" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A6">2 · GENERATE</text>
    <text x="16" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">auto-entrypoints</text>
    <text x="16" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">Vite plugin</text>
  </g>

  <g id="chevron-2">
    <path d="M 600 220 L 620 220" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path d="M 620 220 L 608 213 L 608 227 Z" fill="#7C8CFF"/>
  </g>

  <g id="step-3" transform="translate(636 150)">
    <rect x="0" y="0" width="246" height="140" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A6">3 · EMIT</text>
    <text x="16" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">entrypoints/</text>
    <text x="16" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">component-button-</text>
    <text x="16" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">group.scss</text>
  </g>

  <g id="chevron-3">
    <path d="M 894 220 L 914 220" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path d="M 914 220 L 902 213 L 902 227 Z" fill="#7C8CFF"/>
  </g>

  <g id="step-4" transform="translate(930 150)">
    <rect x="0" y="0" width="246" height="140" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A6">4 · RENDER</text>
    <text x="16" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8CFF">{% render 'vite-tag',</text>
    <text x="16" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8CFF">entry: 'component-</text>
    <text x="16" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8CFF">button.scss' %}</text>
  </g>

  <g id="naming-rules">
    <text x="48" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8A93A6">valid:</text>
    <text x="118" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">_button-group.scss</text>
    <text x="400" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8A93A6">invalid:</text>
    <text x="500" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">_button_group.scss</text>
    <text x="760" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">_button-group-2.scss</text>
    <text x="1000" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8A93A6">(letters only)</text>
  </g>
</svg>
