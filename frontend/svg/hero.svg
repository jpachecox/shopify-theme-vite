<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Shopify Theme Vite</title>
  <desc id="heroDesc">Build tooling for Shopify themes: a Vite pipeline that compiles flat, CDN-safe assets and a generated Liquid snippet. Capabilities: Sass, optional React, cascade layers, flat assets.</desc>

  <defs>
    <filter id="heroGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
  </defs>

  <clipPath id="heroBoard">
    <rect width="1200" height="400" rx="16"/>
  </clipPath>

  <g clip-path="url(#heroBoard)">
    <rect width="1200" height="400" fill="#12151C"/>
    <ellipse cx="1140" cy="-70" rx="290" ry="180" fill="#646CFF" opacity="0.3" filter="url(#heroGlow)"/>
    <ellipse cx="70" cy="450" rx="240" ry="150" fill="#646CFF" opacity="0.13" filter="url(#heroGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#262C38"/>
  </g>

  <g id="title-block" transform="translate(64 56)">
    <rect x="0" y="0" width="48" height="5" rx="2.5" fill="#646CFF"/>
    <text x="0" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4" fill="#8A93A6">SHOPIFY THEME BUILD TOOLING</text>

    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Shopify Theme <tspan fill="#7C8CFF">Vite</tspan></text>

    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#C9CFDB">A Vite build pipeline for Shopify themes: flat,</text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#C9CFDB">CDN-safe assets and a generated Liquid snippet.</text>

    <g id="capabilities" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#C9CFDB">
      <rect x="0" y="234" width="60" height="36" rx="8" fill="#1A1F29" stroke="#2A3140"/>
      <text x="30" y="257" text-anchor="middle">Sass</text>
      <rect x="72" y="234" width="156" height="36" rx="8" fill="#1A1F29" stroke="#2A3140"/>
      <text x="150" y="257" text-anchor="middle">React (optional)</text>
      <rect x="240" y="234" width="140" height="36" rx="8" fill="#1A1F29" stroke="#2A3140"/>
      <text x="310" y="257" text-anchor="middle">cascade layers</text>
      <rect x="392" y="234" width="116" height="36" rx="8" fill="#1A1F29" stroke="#2A3140"/>
      <text x="450" y="257" text-anchor="middle">flat assets</text>
    </g>
  </g>

  <g id="snippet-panel" transform="translate(680 56)">
    <rect x="0" y="0" width="456" height="292" rx="14" fill="#171B22" stroke="#262C38"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8A93A6">snippets/vite-tag.liquid</text>
    <circle cx="352" cy="29" r="4" fill="#95BF47"/>
    <text x="432" y="34" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8A93A6">generated</text>
    <path d="M 24 56 H 432" stroke="#262C38" stroke-width="1"/>

    <text x="24" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7C8CFF">{% render 'vite-tag',</text>
    <text x="149" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#7C8CFF">entry: 'base.scss' %}</text>

    <text x="24" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#6B7280">OUTPUT</text>

    <text x="24" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#E6E9EF">assets/base.css</text>
    <rect x="364" y="204" width="68" height="28" rx="8" fill="#1E2440" stroke="#333C66"/>
    <text x="398" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8C9BFF">?v=</text>

    <text x="24" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#E6E9EF">assets/base.js</text>
    <rect x="364" y="248" width="68" height="28" rx="8" fill="#1E2440" stroke="#333C66"/>
    <text x="398" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8C9BFF">?v=</text>
  </g>
</svg>
