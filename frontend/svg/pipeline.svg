<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">How a build works</title>
  <desc id="pipeDesc">Three stages: source (frontend/ with entrypoints, styles, images, fonts and svg), output (flat assets/ files with the ?v= cache query and manifest.json), and wiring (the generated vite-tag.liquid snippet rendered from Liquid). yarn build:verify enforces flat names, no hashes and manifest parity.</desc>

  <defs>
    <filter id="pipeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <clipPath id="pipeBoard">
      <rect width="1200" height="486" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pipeBoard)">
    <rect width="1200" height="486" fill="#12151C"/>
    <ellipse cx="1130" cy="-30" rx="300" ry="190" fill="#646CFF" opacity="0.3" filter="url(#pipeGlow)"/>
    <ellipse cx="70" cy="524" rx="240" ry="150" fill="#646CFF" opacity="0.13" filter="url(#pipeGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="485" rx="15.5" fill="none" stroke="#262C38"/>
  </g>

  <g id="header" transform="translate(64 44)">
    <rect x="0" y="0" width="48" height="5" rx="2.5" fill="#646CFF"/>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">How a build works</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8A93A6">yarn build turns frontend/ into Shopify-ready output</text>
  </g>

  <g id="stage-source" transform="translate(64 150)">
    <rect x="0" y="0" width="274" height="216" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#8A93A6">01 · SOURCE</text>
    <path d="M 24 48 H 250" stroke="#262C38" stroke-width="1"/>
    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">frontend/</text>
    <text x="24" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">entrypoints/base.scss</text>
    <text x="24" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">styles/** · ITCSS</text>
    <text x="24" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">images · fonts · svg</text>
  </g>

  <g id="arrow-build">
    <text x="400" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7C8CFF">yarn build</text>
    <path d="M 364 258 L 433 258" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path d="M 437 258 L 425 251 L 425 265 Z" fill="#7C8CFF"/>
  </g>

  <g id="stage-output" transform="translate(463 150)">
    <rect x="0" y="0" width="274" height="216" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#8A93A6">02 · OUTPUT</text>
    <path d="M 24 48 H 250" stroke="#262C38" stroke-width="1"/>
    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">assets/</text>
    <text x="24" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">base.css</text>
    <rect x="186" y="106" width="64" height="28" rx="8" fill="#1E2440" stroke="#333C66"/>
    <text x="218" y="125" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8C9BFF">?v=</text>
    <text x="24" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">base.js</text>
    <text x="24" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9CFDB">manifest.json</text>
  </g>

  <g id="arrow-map">
    <text x="800" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7C8CFF">1:1 map</text>
    <path d="M 763 258 L 832 258" stroke="#7C8CFF" stroke-width="2.5" fill="none"/>
    <path d="M 836 258 L 824 251 L 824 265 Z" fill="#7C8CFF"/>
  </g>

  <g id="stage-wire" transform="translate(862 150)">
    <rect x="0" y="0" width="274" height="216" rx="12" fill="#171B22" stroke="#262C38"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#8A93A6">03 · WIRE UP</text>
    <path d="M 24 48 H 250" stroke="#262C38" stroke-width="1"/>
    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">vite-tag.liquid</text>
    <text x="24" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8CFF">{% render 'vite-tag',</text>
    <text x="24" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8CFF">entry: 'base.scss' %}</text>
    <text x="24" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8A93A6">generated at build time</text>
  </g>

  <g id="verify-strip" transform="translate(64 382)">
    <rect x="0" y="0" width="1072" height="56" rx="10" fill="#171B22" stroke="#262C38"/>
    <rect x="0" y="0" width="6" height="56" rx="3" fill="#95BF47"/>
    <text x="28" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E6E9EF">yarn build:verify  —  flat names, no hashes, manifest 1:1</text>
    <text x="1044" y="35" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8A93A6">scripts/verify-assets.ts</text>
  </g>
</svg>
