version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    # Submit PRs to develop
    target-branch: "develop"
    groups:
      # Group minor updates and patches into a single secure PR
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Major updates will be submitted as individual PRs for manual review
    ignore:
      # typescript-eslint and type-coverage crash on the native TS 7 API;
      # re-enable once the toolchain supports it (tracked upstream #10940).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # eslint-plugin-import (peer ^9) and eslint-plugin-react (peer ^9.7)
      # don't declare ESLint 10 support yet, so a 10.x bump breaks the peer
      # tree (YN0060/YN0086, issue #126). Re-enable once both plugins ship
      # ESLint 10-compatible peers.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Submit PRs to develop
    target-branch: "develop"
    groups:
      actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "automated"
    commit-message:
      prefix: "build(deps)"
