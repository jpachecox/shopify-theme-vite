name: Deploy

# Manual-only for now: no Shopify store/theme has been provisioned yet.
# Once dev/QA and production themes exist, fill in the TODOs below
# (store domain, theme IDs, and the SHOPIFY_CLI_THEME_TOKEN secret per
# environment) and this workflow is ready to use as-is.
#
# Required secrets (per environment, once provisioned):
#   SHOPIFY_FLAG_STORE         e.g. your-store.myshopify.com
#   SHOPIFY_CLI_THEME_TOKEN    Theme access token (Shopify admin →
#                               Apps → Develop apps, or `shopify theme
#                               token` from an authenticated CLI session)
#   SHOPIFY_THEME_ID           Numeric theme ID to push to

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    name: Deploy theme (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and verify assets
        run: yarn build:verify

      # TODO: uncomment once the store/theme are provisioned and the
      # secrets above are configured in this environment's settings
      # (Settings → Environments → development / production).
