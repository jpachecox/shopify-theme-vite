      #     SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
      #     SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      #   run: |
      #     shopify theme push \
      #       --theme=${{ secrets.SHOPIFY_THEME_ID }} \
      #       --allow-live=${{ inputs.environment == 'production' }}

      - name: Placeholder — deploy not yet configured
        run: |
          echo "::warning::Deploy step is a placeholder. Provision the ${{ inputs.environment }} Shopify store/theme and configure secrets before enabling the real deploy step."
