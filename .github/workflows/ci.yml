name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Lint, Sass, Types, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache ESLint/Stylelint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .eslintcache
            .stylelintcache
          key: ${{ runner.os }}-lint-cache-${{ hashFiles('yarn.lock', 'frontend/**/*.{js,jsx,ts,tsx,scss}', '{scripts,utils}/**/*.{js,mjs}') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-

      - name: Dependency audit
        run: yarn audit

      - name: Lint (Sass + JS/TS)
        run: yarn lint

      - name: Validate Sass compile-time checks
        run: yarn check:sass

      - name: Type check
        run: yarn check:types

      - name: Entrypoints check
        run: yarn check:entrypoints

      - name: Build and verify assets
        run: yarn build:verify

  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Shopify Theme Check
        uses: Shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install actionlint
        run: bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.9/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color
