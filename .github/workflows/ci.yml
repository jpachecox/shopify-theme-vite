name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Lint, Sass, Types, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache ESLint/Stylelint
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            .stylelintcache
          key: ${{ runner.os }}-lint-cache-${{ hashFiles('yarn.lock', 'frontend/**/*.{js,jsx,ts,tsx,mts,scss}', '{scripts,utils}/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-

      - name: Dependency audit
        run: yarn audit --severity high

      - name: Lint (Sass + JS/TS)
        run: yarn lint

      - name: Validate Sass compile-time checks
        run: yarn check:sass

      - name: Type check
        run: yarn check:types

      - name: Type coverage
        run: yarn check:types:coverage

      - name: Entrypoints check
        run: yarn check:entrypoints

      - name: Component tests (Vitest)
        run: yarn test

      - name: Build and verify assets
        run: yarn build:verify

      - name: Upload dist/ on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: dist/
          retention-days: 7

  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Shopify Theme Check
        run: npx @shopify/cli theme check

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.9/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  secrets-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scanning
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
