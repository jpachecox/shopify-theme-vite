name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Lint, Sass, Types, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (Sass + JS/TS)
        run: yarn lint

      - name: Validate Sass compile-time checks
        run: yarn check:sass

      - name: Type check
        run: yarn check:types

      - name: Entrypoints check
        run: yarn check:entrypoints

      - name: Build and verify assets
        run: yarn build:verify
